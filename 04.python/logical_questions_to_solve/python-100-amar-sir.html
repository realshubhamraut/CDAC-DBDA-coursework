                const filteredQuestions = filterLevel === 'all' 
                    ? questions 
                    : questions.filter(q => q.level === filterLevel);

                filteredQuestions.forEach(q => {
                    const card = document.createElement('div');
                    card.className = 'bg-white p-6 rounded-lg shadow-md hover:shadow-xl transition-shadow duration-300 flex flex-col';
                    card.innerHTML = `
                        <div class="flex-grow">
                            <span class="inline-block bg-blue-100 text-blue-800 text-xs font-semibold mr-2 px-2.5 py-0.5 rounded-full">${q.level}</span>
                            <h3 class="text-xl font-bold mt-2 mb-2 text-slate-900">Q${q.id}: ${q.title}</h3>
                            <p class="text-slate-600 mb-4">${q.question.replace(/\n/g, '<br>')}</p>
                        </div>
                        <div>
                             <button class="toggle-details-btn text-blue-500 font-semibold hover:text-blue-700 transition-colors duration-200">Show Details ▼</button>
                             <div class="details-content mt-4 border-t pt-4">
                                <h4 class="font-semibold text-slate-700">Sample Input:</h4>
                                <pre><code>${q.input}</code></pre>
                                <h4 class="font-semibold text-slate-700 mt-4">Expected Output:</h4>
                                <pre><code>${q.output}</code></pre>
                            </div>
                        </div>
                    `;
                    questionsContainer.appendChild(card);
                });

                document.querySelectorAll('.toggle-details-btn').forEach(button => {
                    button.addEventListener('click', (event) => {
                        const details = event.target.nextElementSibling;
                        const isVisible = details.classList.contains('show');
                        if (isVisible) {
                            details.classList.remove('show');
                            event.target.textContent = 'Show Details ▼';
                        } else {
                            details.classList.add('show');
                            event.target.textContent = 'Hide Details ▲';
                        }
                    });
                });
            };

            levelFilters.addEventListener('click', (event) => {
                if (event.target.tagName === 'BUTTON') {
                    document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
                    event.target.classList.add('active');
                    const level = event.target.getAttribute('data-level');
                    renderQuestions(level);
                }
            });
